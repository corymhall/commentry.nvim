[tools]
neovim = "stable"
stylua = "latest"
"cargo:selene" = "latest"
go = "1.26.5"
golangci-lint = "2"
hk = "1.55"
node = "26.7.0"

[tasks.test]
description = "Run Lua and Go tests"
depends = ["test_lua", "test_go", "test_executor"]

[tasks.test_lua]
description = "Run mini.test suite"
depends = ["build_go"]
run = "./scripts/test"

[tasks.test_go]
description = "Run Go tests"
run = "go test ./..."

[tasks.docs]
description = "Validate README and vimdoc release docs"
run = "./scripts/docs"

[tasks.format]
description = "Format Lua and Go sources"
depends = ["format_lua", "format_go", "format_executor"]

[tasks.format_lua]
description = "Format Lua sources"
run = "stylua lua tests plugin capture integrations repro.lua"

[tasks.format_go]
description = "Format Go sources"
run = "golangci-lint fmt"

[tasks.lint_stylua]
description = "Check formatting with StyLua"
run = "stylua --check lua tests plugin capture integrations repro.lua"

[tasks.lint_selene]
description = "Lint Lua with Selene"
run = "selene --display-style=quiet --allow-warnings lua plugin"

[tasks.lint]
description = "Run all lint checks"
depends = ["lint_stylua", "lint_selene", "lint_go", "lint_executor"]

[tasks.lint_go]
description = "Check Go code with hk and golangci-lint"
run = "hk check --all --safe"

[tasks."lint:fix"]
description = "Apply Go lint fixes through hk"
run = "hk fix --all"

[tasks.build]
description = "Lint, test, and build the Go CLI"
depends = ["lint_go", "test_go", "build_go"]

[tasks.build_go]
description = "Compile the Go backend for Neovim and CLI use"
run = "go build -o bin/commentry ."

[tasks.run]
description = "Run the Go CLI"
run = "go run ."

[tasks.install-commentry]
description = "Build and install the Go CLI to ~/.local/bin"
depends = ["build"]
run = """
mkdir -p "$HOME/.local/bin"
install -m 0755 bin/commentry "$HOME/.local/bin/commentry"
"""

[tasks.health]
description = "Run commentry checkhealth"
run = "nvim --headless \"+checkhealth commentry\" +qa"

[tasks.ci]
description = "Run CI task set"
depends = ["lint", "test", "health", "docs"]

[tasks.setup_executor]
description = "Install the pinned Executor app development tools"
run = "npm install --prefix integrations/executor --ignore-scripts --no-package-lock"

[tasks.test_executor]
description = "Test Executor inbox operations against isolated SQLite"
run = "node --import ./tests/executor_loader.mjs --disable-warning=ExperimentalWarning --test tests/executor*.test.ts"

[tasks.format_executor]
description = "Format Executor TypeScript sources"
run = "integrations/executor/node_modules/.bin/prettier --write 'integrations/executor/*.{ts,json}' 'tests/executor*.ts' tests/executor_loader.mjs scripts/agent-trial.ts"

[tasks.lint_executor]
description = "Type-check and check formatting of the Executor app"
run = """
integrations/executor/node_modules/.bin/prettier --check 'integrations/executor/*.{ts,json}' 'tests/executor*.ts' tests/executor_loader.mjs scripts/agent-trial.ts
integrations/executor/node_modules/.bin/tsc --ignoreConfig --noEmit --strict --skipLibCheck --module nodenext --moduleResolution nodenext --target es2022 integrations/executor/index.ts
"""


[tasks.agent_trials]
description = "Run isolated Commentry consumer trial fixtures"
run = "node --import ./tests/executor_loader.mjs --disable-warning=ExperimentalWarning scripts/agent-trial.ts"
